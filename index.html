<style>
  :root{
    --page-bg: #0a0a0b;
    --ink-dark: #14100c;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{ height:100%; }

  body{
    background:
      radial-gradient(900px 500px at 18% -8%, #17151a 0%, transparent 60%),
      radial-gradient(800px 460px at 100% 4%, #151318 0%, transparent 55%),
      var(--page-bg);
    color: #f4f4f5;
    font-family: 'DM Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a{ color:inherit; text-decoration:none; }

  .page{
    height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 3.5vh 4vw;
    overflow: hidden;
  }

  main{
    height: 82vh;
    display: grid;
    grid-template-columns: repeat(3, 216px);
    grid-template-rows: 2fr 1fr 1fr;
    gap: 14px;
  }

  /* ---------- Base card ---------- */
  .card{
    border-radius: 24px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 10px;
    position: relative;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .card:hover{ transform: translateY(-3px); }
  .card:hover .arrow-chip{ transform: scale(1.08); }

  .card-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
  }
  .icon-badge{
    width: 34px; height:34px;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    flex: 0 0 auto;
  }
  .icon-badge svg{ width:16px; height:16px; }

  .arrow-chip{
    width: 30px; height: 30px;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    flex: 0 0 auto;
    transition: transform .18s ease;
  }
  .arrow-chip svg{ width: 13px; height: 13px; }

  .card-title{
    font-size: 16.5px;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }
  .card-sub{
    font-size: 11px;
    font-weight: 500;
    opacity: .72;
    margin-top: 3px;
  }

  .card-link{
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  /* ---------- Credential chips ---------- */
  .creds{ display:flex; flex-direction:column; gap: 6px; }
  .cred-chip{
    display:flex; align-items:center; justify-content:space-between;
    gap: 6px;
    border-radius: 10px;
    padding: 6px 8px;
    min-width: 0;
  }
  .cred-chip .val{
    font-family:'DM Mono', monospace;
    font-size: 10.5px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    min-width: 0;
  }
  .cred-chip .lbl{
    font-family:'DM Mono', monospace;
    font-size: 8px;
    letter-spacing: .05em;
    text-transform: uppercase;
    opacity: .55;
    flex: 0 0 auto;
    margin-right: 2px;
  }
  .copy-btn{
    flex-shrink:0;
    background: transparent;
    border: none;
    border-radius: 6px;
    width: 20px; height: 20px;
    display:flex; align-items:center; justify-content:center;
    cursor: pointer;
    opacity: .8;
    transition: opacity .15s ease, transform .15s ease;
    position: relative;
    z-index: 2;
  }
  .copy-btn:hover{ opacity: 1; transform: scale(1.08); }
  .copy-btn svg{ width: 11px; height: 11px; }
  .copy-btn.copied svg{ color: #8ee0a8 !important; }

  .open-pill{
    display:flex; align-items:center; justify-content:center; gap:6px;
    width: 100%;
    border-radius: 12px;
    padding: 8px;
    font-weight: 700;
    font-size: 11.5px;
    position: relative;
    z-index: 2;
    transition: filter .15s ease;
  }
  .open-pill:hover{ filter: brightness(1.12); }
  .open-pill svg{ width: 11px; height: 11px; }

  /* ---------- Color variants ---------- */
  .green{ background: linear-gradient(160deg, #c3dd85, #82a848); color:#152309; }
  .green .icon-badge{ background: rgba(0,0,0,0.14); color:#152309; }
  .green .arrow-chip{ background: rgba(0,0,0,0.14); color:#152309; }
  .green .cred-chip{ background: rgba(0,0,0,0.12); }
  .green .cred-chip .val{ color:#152309; }
  .green .open-pill{ background:#152309; color:#e4f2c4; }

  .violet{ background: linear-gradient(160deg, #9a86f5, #5c42c9); color:#fff; }
  .violet .icon-badge{ background: rgba(255,255,255,0.18); color:#fff; }
  .violet .arrow-chip{ background: rgba(255,255,255,0.18); color:#fff; }
  .violet .cred-chip{ background: rgba(255,255,255,0.14); }
  .violet .cred-chip .val{ color:#fff; }
  .violet .open-pill{ background:#fff; color:#4a35b3; }

  .orange{ background: linear-gradient(160deg, #f4a35e, #dd6a24); color:#2a1204; }
  .orange .icon-badge{ background: rgba(0,0,0,0.16); color:#2a1204; }
  .orange .arrow-chip{ background: rgba(0,0,0,0.16); color:#2a1204; }
  .orange .cred-chip{ background: rgba(0,0,0,0.14); }
  .orange .open-pill{ background:#2a1204; color:#ffd9b0; }

  .pink{ background: linear-gradient(160deg, #f6cfe4, #ea9fc7); color:#3a0f28; }
  .pink .icon-badge{ background: rgba(0,0,0,0.1); color:#3a0f28; }
  .pink .arrow-chip{ background: rgba(0,0,0,0.1); color:#3a0f28; }
  .pink .open-pill{ background:#3a0f28; color:#fbdcee; }

  .teal{ background: linear-gradient(160deg, #8fe6d6, #33ab9b); color:#062824; }
  .teal .icon-badge{ background: rgba(0,0,0,0.12); color:#062824; }
  .teal .arrow-chip{ background: rgba(0,0,0,0.12); color:#062824; }
  .teal .cred-chip{ background: rgba(0,0,0,0.1); }
  .teal .cred-chip .val{ color:#062824; }
  .teal .open-pill{ background:#062824; color:#c8f2ea; }

  .blue{ background: linear-gradient(160deg, #93c9f6, #3f83d6); color:#fff; }
  .blue .icon-badge{ background: rgba(255,255,255,0.2); color:#fff; }
  .blue .arrow-chip{ background: rgba(255,255,255,0.2); color:#fff; }
  .blue .open-pill{ background:#fff; color:#2f66ac; }

  .red .arrow-chip{ background: rgba(255,255,255,0.2); color:#fff; }

  .purple .open-pill{ background:#fff; color:#7a45bd; }

    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1e1c1a;
    border: 1px solid #2e2b28;
    color: #f4f4f5;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 50;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Mobile ---------- */

      max-width: 480px;
      margin: 0 auto;

    }
    .card{ min-height: 150px; }
    .card-title{ font-size: 15px; }
  }
  @media (max-width: 420px){
    main{ grid-template-columns: 1fr 1fr; }
  }
</style>

<script>
  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.preventDefault();
      e.stopPropagation();
      const val = btn.getAttribute('data-copy');
      try{
        await navigator.clipboard.writeText(val);
      }catch(err){
        const ta = document.createElement('textarea');
        ta.value = val;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      btn.classList.add('copied');
      showToast('Disalin ke clipboard');
      setTimeout(()=> btn.classList.remove('copied'), 1200);
    });
  });

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(()=> t.classList.remove('show'), 1800);
  }
</script>

</body>
</html>
